<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance</title><link rel="stylesheet" href="css/style.css"></head>
<body data-protected="student"><header class="container topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">C</span> Student Portal</a><a class="link" href="dashboard.html">← Dashboard</a></header><main class="container section"><span class="eyebrow">STUDENT RECORDS</span><h1 style="margin-top:12px">Attendance</h1><p>Your subject-wise attendance records, calculated from attendance entered by college administration.</p><section class="panel"><div id="records"><p class="empty">Loading your records…</p></div></section></main><div id="toast-host"></div><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/common.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{try{const data=await PortalAPI.get('/student/attendance');const rows=data.records||[];const host=document.querySelector('#records');if(!rows.length){host.innerHTML='<p class="empty">No records have been published for your account yet. Please contact college administration if you think this is incorrect.</p>';return;}host.innerHTML=rows.map(r=>'<article class="notice"><b>'+escapeHTML(r.subjectName||r.description||r.title||'Record')+'</b><p>'+escapeHTML(JSON.stringify(r, (k,v)=>['_id','student','__v'].includes(k)?undefined:v))+'</p></article>').join('');}catch(e){toast(e.message,'error');location.href='login.html';}});
</script></body></html>
